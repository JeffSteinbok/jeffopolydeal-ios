name: JeffopolyDeal
options:
  bundleIdPrefix: net.steinbok.jeffopolydeal
  deploymentTarget:
    iOS: "17.0"
packages:
  SignalRClient:
    url: https://github.com/moozzyk/SignalR-Client-Swift.git
    from: 0.9.0
targets:
  JeffopolyDeal:
    type: application
    platform: iOS
    sources:
      - JeffopolyDeal
    dependencies:
      - package: SignalRClient
    info:
      path: JeffopolyDeal/Info.plist
      properties:
        UILaunchScreen: {}
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - Inter-ExtraBold.ttf
          - Inter-Black.ttf
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.steinbok.jeffopolydeal
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
