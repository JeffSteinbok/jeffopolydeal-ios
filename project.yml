name: JeffopolyDeal
options:
  bundleIdPrefix: net.steinbok.jeffopolydeal
  deploymentTarget:
    iOS: "17.0"
packages:
  SignalRClient:
    url: https://github.com/moozzyk/SignalR-Client-Swift.git
    from: 0.9.0
targets:
  JeffopolyDeal:
    type: application
    platform: iOS
    sources:
      - JeffopolyDeal
    dependencies:
      - package: SignalRClient
    info:
      path: JeffopolyDeal/Info.plist
      properties:
        CFBundleDisplayName: Jeffopoly Deal
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - Inter-ExtraBold.ttf
          - Inter-Black.ttf
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        ITSAppUsesNonExemptEncryption: false
        JEFFOPOLYDEAL_BASE_URL: https://jeffopolydeal.azurewebsites.net
        NSLocalNetworkUsageDescription: Jeffopoly Deal uses your local network to find nearby games hosted by friends.
        NSBluetoothAlwaysUsageDescription: Jeffopoly Deal uses Bluetooth to discover games hosted nearby.
        NSBonjourServices:
          - _jeffopolydl._tcp
          - _jeffopolydl._udp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.steinbok.jeffopolydeal
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Y7KVX7666P
        SWIFT_VERSION: "5.0"
        VERSIONING_SYSTEM: apple-generic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
